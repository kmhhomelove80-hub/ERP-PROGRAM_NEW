{% extends 'inventory/base.html' %}{% block content %}<h1>재고 이동 요청</h1><p>{% if user.is_staff %}<span class="desktop-only">전체 요청을 확인하고 상세 화면에서 반영하거나 거부합니다.</span><span class="mobile-only">이동 요청과 처리 결과를 확인합니다. 반영/거부는 PC에서 처리합니다.</span>{% else %}내가 요청한 이동과 처리 결과입니다.{% endif %} <a href="{% url 'stock-list' %}">재고에서 새 이동 요청</a></p><form class="filters" data-live-filter data-results="#movement-results" data-status="#movement-search-status"><input name="q" aria-label="품번 또는 위치 검색" value="{{ query }}" placeholder="품번 또는 위치"><select name="status" aria-label="요청 상태"><option value="" {% if not status %}selected{% endif %}>전체 상태</option><option value="pending" {% if status == 'pending' %}selected{% endif %}>대기</option><option value="completed" {% if status == 'completed' %}selected{% endif %}>완료</option><option value="rejected" {% if status == 'rejected' %}selected{% endif %}>거부</option></select><button>검색 / 새로고침</button></form><p id="movement-search-status" role="status" aria-live="polite"></p><section id="movement-results">{% include 'inventory/movement_results.html' %}</section>{% load static %}<script src="{% static 'inventory/live_stock.js' %}" defer></script>{% endblock %}
