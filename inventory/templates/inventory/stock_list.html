{% extends 'inventory/base.html' %}{% block content %}<h1>위치별 재고</h1>{% if user.is_staff %}<p class="desktop-only"><a id="stock-export" href="{% url 'stock-export' %}?q={{ query|urlencode }}&amp;status={{ status|urlencode }}">현재 검색 전체 엑셀 내보내기</a></p>{% endif %}<p class="notice desktop-only">개발 검증 중입니다. 운영 전 데이터 이관·대조와 백업 검증이 필요합니다.</p><form class="filters" id="stock-filter"><input autocomplete="off" maxlength="250" aria-label="재고 검색" name="q" value="{{ query }}" placeholder="ERP 코드, 모델, 사양, 위치"><button type="button" id="scan-open" aria-label="바코드·QR 스캔" title="바코드·QR 스캔"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5M7 8v8M10 7v10M14 7v10M17 8v8M4 12h16"/></svg></button><select aria-label="입고 상태" name="status"><option value="">전체 상태</option>{% for value,label in statuses %}<option value="{{ value }}" {% if status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button>검색</button></form><dialog id="scan-dialog" aria-labelledby="scan-title"><h2 id="scan-title">바코드 · QR 검색</h2><video id="scan-video" autoplay muted playsinline></video><label class="button" for="scan-photo">사진 촬영 / 이미지에서 읽기</label><input id="scan-photo" type="file" accept="image/*" capture="environment"><p id="scan-status" role="status"></p><button type="button" id="scan-close">닫기</button></dialog><p id="stock-search-status" role="status" aria-live="polite"></p><section id="stock-results">{% include 'inventory/stock_results.html' %}</section>{% load static %}<script src="{% static 'inventory/live_stock.js' %}?v=20261101-sort1" defer></script><script src="{% static 'inventory/vendor/zxing-0.21.3.min.js' %}" defer></script><script src="{% static 'inventory/stock_scan.js' %}?v=20261102-mobile" defer></script>{% endblock %}
