{% extends 'inventory/base.html' %}{% block content %}<h1>회사 프린터 설정</h1><p>회사 서버에서 인쇄 작업을 실행하는 Windows 계정에 등록된 프린터 이름을 입력하세요. 이 설정만으로 인쇄 작업자가 설치되거나 Windows 프린터가 공유되지는 않습니다.</p><form method="post" class="card entry">{% csrf_token %}<label>Windows 프린터 이름 <input name="name" maxlength="250" value="{{ printer.name }}"></label><label><input type="checkbox" name="enabled" {% if printer.enabled %}checked{% endif %}> 회사 프린터 출력 허용</label><button>저장</button></form><p><a href="{% url 'company-print-jobs' %}">출력 이력</a></p>{% endblock %}
