<script>
(async()=>{const KEY='sunil.delivery.forward.v1';let draft=null;function message(t){const p=document.createElement('p');p.className='notice';p.textContent=t;document.querySelector('main').prepend(p)}
try{if(document.getElementById('delivery-reply-url')){sessionStorage.removeItem(KEY);return}if(location.hash.startsWith('#sunil_forward=')){const token=location.hash.slice(15);if(token.length>180000)throw Error('전송 자료가 너무 큽니다.');const raw=Uint8Array.from(atob(token.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-token.length%4)%4)),c=>c.charCodeAt(0));const reader=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();let pieces=[],size=0;while(true){const {done,value}=await reader.read();if(done)break;size+=value.length;if(size>1200000){reader.cancel();throw Error('전송 자료가 너무 큽니다.')}pieces.push(value)}draft=JSON.parse(await new Blob(pieces).text());if(draft.version!==1||!Array.isArray(draft.rows)||draft.rows.length<1||draft.rows.length>500||Date.now()/1000-draft.issued_at>86400)throw Error('전송 자료가 만료됐거나 형식이 다릅니다.');sessionStorage.setItem(KEY,JSON.stringify(draft));history.replaceState(null,'',location.pathname+location.search);}else{const stored=sessionStorage.getItem(KEY);if(stored)draft=JSON.parse(stored)}
if(!draft)return;if(Date.now()/1000-draft.issued_at>86400){sessionStorage.removeItem(KEY);throw Error('전송 자료가 만료됐습니다. 수주관리에서 다시 보내세요.')}const field=document.getElementById('id_customer_rows');if(!field){message('수주관리 자료를 임시 보관했습니다. ERP에 로그인한 뒤 피킹 요청 화면에서 자동 입력됩니다.');return}if((field.value.trim()||document.getElementById('id_pasted_rows')?.value.trim())&&!confirm('기존 피킹 입력을 수주관리 전송 자료로 바꾸시겠습니까?')){sessionStorage.removeItem(KEY);return}const rows=draft.rows.map(r=>{if(!Array.isArray(r.values)||r.values.length!==7)throw Error('고객 자료는 7열이어야 합니다.');return r.values.join('\t')});field.value=rows.join('\n');document.getElementById('id_bridge_token').value=JSON.stringify(draft);document.getElementById('id_request_id').value=draft.transfer_id;const project=document.getElementById('id_project');if(project&&!project.value)project.value=draft.project||'수주관리 추출';const two=document.getElementById('id_pasted_rows');if(two)two.value='';field.dispatchEvent(new Event('input',{bubbles:true}));sessionStorage.removeItem(KEY);message(`${rows.length}행의 7열 자료를 받았습니다. 배정 미리보기와 예약 등록을 완료하면 수주관리로 결과가 회신됩니다.`);}catch(e){message('수주관리 자료를 받지 못했습니다: '+e.message)}})();
</script>
