name: Actas diagnostic Windows checks
on:
  push:
    branches: ['validation/actas-diagnostic-*']
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test inventory.test_actas_collection --noinput
