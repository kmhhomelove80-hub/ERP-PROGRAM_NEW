name: Actas export pilot checks
on:
  push:
    branches: ['validation/actas-export-pilot-*']
permissions:
  contents: read
jobs:
  pilot:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_actas_export_check.py
