name: Integrated update checks
on:
  push:
    branches: ['validation/production-20261104-*']
permissions:
  contents: read
jobs:
  windows-python312:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python scripts/check_laptop_upgrade.py
      - run: node scripts/test_delivery_receiver.cjs
      - run: python scripts/test_standard_update.py
      - run: python scripts/test_standard_update_windows.py
  postgresql18:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: integration_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: integration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U integration_test -d integration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ERP_DB_NAME: integration_test
      ERP_DB_USER: integration_test
      ERP_DB_PASSWORD: disposable-ci-only
      ERP_DB_HOST: 127.0.0.1
      ERP_DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
  browser:
    runs-on: ubuntu-latest
    env:
      ERP_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright==1.62.0
      - run: python scripts/smoke_production.py
      - run: python scripts/smoke_menu_permissions.py
